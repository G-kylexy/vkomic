name: Deploy VK ID callback and catalog

on:
  push:
    branches: [main]
    paths:
      - "docs/vk-callback.html"
      - "scripts/generate-vk-catalog.mjs"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      refresh_catalog:
        # Off by default: the service token gets VK API error 1051 until VK approves the app.
        description: "Regenerate the VK catalog before deployment (requires VK approval)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify catalog parser
        run: node scripts/generate-vk-catalog.mjs --self-test
      - name: Generate VK catalog
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_catalog
        env:
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
          VK_MAX_API_CALLS: "1800"
        run: node scripts/generate-vk-catalog.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload callback page
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
